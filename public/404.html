<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Page Not Found | ArthaDrishti</title>
  <meta name="description" content="The requested page does not exist on ArthaDrishti." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    :root {
      --bg: #0B1220;
      --card-bg: #111B2E;
      --ink: #F1F3F9;
      --muted: #94A3B8;
      --gold: #C5A152;
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(197, 161, 82, 0.12);
      border: 1px solid rgba(197, 161, 82, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 20px;
    }
    .code {
      font-size: 64px;
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }
    p {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    a.btn {
      display: inline-block;
      background: var(--gold);
      color: #0B1220;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 8px;
      transition: opacity 0.15s ease;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">HTTP 404 Status</div>
    <div class="code">404</div>
    <h1>Resource Not Found</h1>
    <p>The page or endpoint you requested does not exist on ArthaDrishti.</p>
    <a href="/" class="btn">Return to Dashboard</a>
  </main>
</body>
</html>
