name: Sync DB Schema

# Runs whenever a SQL migration file is added or changed on main.
# Applies schema sync (idempotent) to the connected Supabase DB via
# the Supabase Management API over HTTPS — no direct TCP needed.
#
# Optional GitHub Secret:
#   SUPABASE_ACCESS_TOKEN — Supabase personal access token
#                           supabase.com → Account → Access Tokens → Generate
#   SUPABASE_PROJECT_REF  — (Optional) Supabase project ref, defaults to live project

on:
  push:
    branches: [main]
    paths:
      - "database/**"
  workflow_dispatch: # allow manual trigger from GitHub Actions tab

jobs:
  sync-schema:
    name: Apply schema to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run schema sync via Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'mordmjexjipkomuekjfy' }}
        run: |
          # 1. Resolve schema sync file
          if [ -f "database/fix_schema_sync.sql" ]; then
            SQL_FILE="database/fix_schema_sync.sql"
          elif [ -f "database/schema.sql" ]; then
            SQL_FILE="database/schema.sql"
          elif [ -f "database/migrations_archive/fix_schema_sync.sql" ]; then
            SQL_FILE="database/migrations_archive/fix_schema_sync.sql"
          else
            echo "::notice::No SQL schema sync file found in database/. Skipping."
            exit 0
          fi

          # 2. Check if SUPABASE_ACCESS_TOKEN is configured
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN secret is not configured in GitHub repository secrets. Skipping automated database sync. Schema changes should be applied via Supabase SQL Editor."
            exit 0
          fi

          SQL=$(cat "$SQL_FILE")
          PROJECT_ID="${SUPABASE_PROJECT_REF:-mordmjexjipkomuekjfy}"

          echo "Applying $SQL_FILE to Supabase project $PROJECT_ID..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$PROJECT_ID/database/query" \
            --data-binary "{\"query\": $(echo "$SQL" | jq -Rs .)}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Schema sync complete"
            exit 0
          fi

          # If the project is unavailable, decommissioned, or credentials lack management API access
          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ]; then
            echo "::warning::Supabase project $PROJECT_ID returned HTTP $HTTP_CODE ($BODY). Check SUPABASE_ACCESS_TOKEN and project status. Schema changes can also be applied directly via the Supabase SQL Editor."
            exit 0
          fi

          echo "::error::Migration failed with HTTP $HTTP_CODE: $BODY"
          exit 1
